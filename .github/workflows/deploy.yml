name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/amir1330/telegram-queue-bot:latest

      - name: Trigger deploy
        run: |
          echo "Triggering deploy on ${{ secrets.VPS_HOST }}:9001 ..."
          for i in 1 2 3; do
            status=$(curl -s --fail -o /dev/null -w "%{http_code}" --max-time 30 -X POST \
              http://${{ secrets.VPS_HOST }}:9001/hooks/deploy \
              -H "Content-Type: application/json" \
              -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}")
            echo "Attempt $i: HTTP $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Deploy trigger failed after 3 attempts. Is the webhook listening on port 9001?"
          exit 1
